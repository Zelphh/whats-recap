[package]
name = "whats-recap"
description = "Analisador de conversas do WhatsApp, 100% local"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "whats_recap_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
chrono = "0.4.45"
core-media = { version = "0.1.0", path = "../crates/core-media" }
core-parser = { version = "0.1.0", path = "../crates/core-parser" }
core-stats = { version = "0.1.0", path = "../crates/core-stats" }
core-storage = { version = "0.1.0", path = "../crates/core-storage" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.11.6", features = [] }
tauri-plugin-dialog = "2.7.3"
