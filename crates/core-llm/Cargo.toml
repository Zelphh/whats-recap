[package]
name = "core-llm"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.21"
ureq = { version = "3.5.0", features = ["json"] }

[target.'cfg(windows)'.dependencies]
# VRAM em uso por todos os processos (DXGI + contador de desempenho); o mesmo `windows` do Tauri.
windows = { version = "0.61.3", features = ["Win32_Graphics_Dxgi", "Win32_System_Performance"] }

[dev-dependencies]
# O example e o teste com modelo real usam os contratos do chat.
chrono = "0.4.45"
core-chat = { version = "0.1.0", path = "../core-chat" }
core-storage = { version = "0.1.0", path = "../core-storage" }
